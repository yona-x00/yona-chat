<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yona chat</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-primary: #313338;
            --bg-secondary: #2b2d31;
            --bg-tertiary: #1e1f22;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --brand: #5865f2;
            --brand-hover: #4752c4;
            --success: #23a55a;
            --danger: #da373c;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'GG Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-normal);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #setup-panel {
            width: 320px;
            background-color: var(--bg-tertiary);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #3f4147;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow-y: auto; 
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .discord-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        h2, h3 {
            margin: 0;
            color: #fff;
        }

        h2 { font-size: 20px; }
        h3 { font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin-top: 10px;}

        input[type="text"] {
            width: 100%;
            background-color: var(--bg-secondary);
            border: 1px solid #111;
            color: var(--text-normal);
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        
        input[type="text"]:focus { border-color: var(--brand); }

        .mode-container {
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            flex: 1;
            background-color: var(--bg-secondary);
            border: 1px solid #222;
            color: var(--text-muted);
            padding: 10px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active {
            background-color: var(--brand);
            color: white;
            border-color: transparent;
        }

        .code-display {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            text-align: center;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            color: #fff;
        }

        button {
            background-color: var(--brand);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--brand-hover); }
        button:disabled { background-color: #4e5058; cursor: not-allowed; }
        
        .status {
            padding: 8px;
            border-radius: 4px;
            background: #222;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
        }
        .disconnected { color: #f23f43; }
        .connecting { color: #f0b232; }
        .connected { color: var(--success); }

        #main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            height: 100%;
        }

        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
            padding: 15px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid #3f4147;
            max-height: 45%;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #video-grid:empty { display: none; }

        .video-wrapper {
            position: relative;
            background-color: #111;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        .local-video { transform: scaleX(-1); }

        .video-label {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .controls-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid #3f4147;
            box-sizing: border-box;
            z-index: 99;
            flex-wrap: wrap;
        }
        
        .control-btn {
            flex: 1;
            min-width: 85px;
            max-width: 130px;
            padding: 12px 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 24px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            background-color: #4e5058;
            color: white;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .btn-danger { background-color: var(--danger) !important; }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { display: flex; flex-direction: column; }
        .msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .username { font-weight: 600; color: #fff; }
        .timestamp { font-size: 12px; color: var(--text-muted); }
        .msg-text { color: var(--text-normal); word-break: break-word; line-height: 1.375rem; }

        #input-area { padding: 0 20px 24px 20px; }
        .input-wrapper { background-color: #383a40; border-radius: 8px; padding: 11px 16px; }
        #msg-input { width: 100%; background: transparent; border: none; color: var(--text-normal); font-size: 16px; outline: none; }
        #msg-input::placeholder { color: var(--text-muted); }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #setup-panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #3f4147; padding: 15px; gap: 10px; }
            
            #video-grid { max-height: 35vh; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); padding: 8px; gap: 6px; }
            
            body.video-active #video-grid {
                height: 55vh;
                max-height: 55vh;
            }
            body.video-active #messages {
                flex: 1;
            }

            #messages { padding: 15px; gap: 12px; }
            #input-area { padding: 0 12px 16px 12px; }
            
            body.connected-layout #setup-panel { display: none; }
        }
    </style>
</head>
<body>

    <div id="setup-panel">
        <div class="header-container">
            <img class="discord-logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw6wiociLBFC-02UXkUifps90kccxYnApG-8Pd-CvhJQ&s=10" alt="Discord Icon">
            <h2>yona chat</h2>
        </div>
        <div id="status" class="status disconnected">Disconnected</div>

        <hr style="border: 0; border-top: 1px solid #3f4147; width: 100%; margin: 5px 0;">

        <h3>Your Name</h3>
        <input type="text" id="username-input" placeholder="Enter your username...">

        <h3>Select Room Type</h3>
        <div class="mode-container">
            <button id="btn-mode-text" class="mode-btn active">💬 Text Chat</button>
            <button id="btn-mode-video" class="mode-btn">📹 Video Call</button>
        </div>

        <h3> Create a Room</h3>
        <button id="btn-create">Generate 6-Digit Code</button>
        <div id="room-code-output" class="code-display" style="display:none;">------</div>
        
        <h3> Join a Room</h3>
        <input type="text" id="room-code-input" placeholder="Enter 6-digit code" maxlength="6">
        <button id="btn-join" style="background-color: var(--success); margin-top: 5px;">Join Room</button>
    </div>

    <div id="main-workspace">
        <div id="video-grid"></div>

        <div id="media-controls" class="controls-container" style="display: none;">
            <button id="btn-toggle-mic" class="control-btn">🎤 Mute Mic</button>
            <button id="btn-toggle-cam" class="control-btn">📷 Cam Off</button>
            <button id="btn-switch-cam" class="control-btn">🔄 Switch Cam</button>
            <button id="btn-share-screen" class="control-btn">🖥️ Share Screen</button>
        </div>

        <div id="messages">
            <div class="message">
                <div class="msg-header">
                    <span class="username" style="color: var(--brand);">System</span>
                    <span class="timestamp">Now</span>
                </div>
                <div class="msg-text">Welcome! to yona chat to start a coversation</div>
            </div>
        </div>
        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="msg-input" placeholder="Chat is locked until P2P links..." disabled autocomplete="off">
            </div>
        </div>
    </div>

    <script>
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        const mqttBroker = 'wss://broker.emqx.io:8084/mqtt'; 
        const peers = {}; 
        
        let mqttClient;
        let currentRoomTopic = '';
        let localStream = null;
        let screenStream = null;
        let selectedMode = 'text'; 
        let currentFacingMode = 'user'; 
        let isSharingScreen = false;
        
        const myClientId = 'client_' + Math.floor(Math.random() * 10000000);
        let myUsername = 'User_' + Math.floor(Math.random() * 9000 + 1000);

        const usernameInput = document.getElementById('username-input');
        const btnCreate = document.getElementById('btn-create');
        const btnJoin = document.getElementById('btn-join');
        const roomCodeOutput = document.getElementById('room-code-output');
        const roomCodeInput = document.getElementById('room-code-input');
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const videoGrid = document.getElementById('video-grid');
        const mediaControls = document.getElementById('media-controls');
        const btnToggleMic = document.getElementById('btn-toggle-mic');
        const btnToggleCam = document.getElementById('btn-toggle-cam');
        const btnSwitchCam = document.getElementById('btn-switch-cam');
        const btnShareScreen = document.getElementById('btn-share-screen');
        
        const btnModeText = document.getElementById('btn-mode-text');
        const btnModeVideo = document.getElementById('btn-mode-video');

        usernameInput.value = myUsername;

        btnModeText.addEventListener('click', () => {
            selectedMode = 'text';
            btnModeText.classList.add('active');
            btnModeVideo.classList.remove('active');
        });

        btnModeVideo.addEventListener('click', () => {
            selectedMode = 'video';
            btnModeVideo.classList.add('active');
            btnModeText.classList.remove('active');
        });

        function finalizeUsername() {
            const chosenName = usernameInput.value.trim();
            if (chosenName !== "") myUsername = chosenName;
            usernameInput.disabled = true;
            btnModeText.disabled = true;
            btnModeVideo.disabled = true;
        }

        async function setupLocalMedia() {
            mediaControls.style.display = 'flex'; 
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode }, 
                    audio: true 
                });
                addVideoElement('local', `${myUsername} (You)`, localStream, true);
            } catch (err) {
                console.error("Error accessing media devices.", err);
                alert("Camera blocked or HTTP insecure environment. Buttons are visible, but devices won't broadcast without HTTPS or localhost.");
            }
        }

        function connectSignaling(roomCode, callback) {
            updateRoomStatus('connecting', 'Connecting to signaling...');
            currentRoomTopic = `p2p/room/${roomCode}`;
            
            mqttClient = mqtt.connect(mqttBroker);
            
            mqttClient.on('connect', () => {
                mqttClient.subscribe(currentRoomTopic, () => { callback(); });
            });

            mqttClient.on('message', async (topic, message) => {
                try {
                    const packet = JSON.parse(message.toString());
                    if (packet.clientId === myClientId) return;
                    if (packet.targetId && packet.targetId !== myClientId) return;

                    if (packet.type === 'join') {
                        if (myClientId > packet.clientId) {
                            initPeer(packet.clientId, packet.sender, true);
                        } else {
                            sendSignal('presence', null, packet.clientId);
                        }
                    } 
                    else if (packet.type === 'presence') {
                        if (myClientId > packet.clientId) {
                            initPeer(packet.clientId, packet.sender, true);
                        }
                    } 
                    else if (packet.type === 'offer') {
                        const pc = initPeer(packet.clientId, packet.sender, false);
                        await pc.setRemoteDescription(new RTCSessionDescription(packet.data));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        sendSignal('answer', answer, packet.clientId);
                    } 
                    else if (packet.type === 'answer') {
                        if (peers[packet.clientId]) {
                            await peers[packet.clientId].peerConnection.setRemoteDescription(new RTCSessionDescription(packet.data));
                        }
                    } 
                    else if (packet.type === 'ice') {
                        if (peers[packet.clientId]) {
                            try { await peers[packet.clientId].peerConnection.addIceCandidate(packet.data); } catch(e){}
                        }
                    }
                } catch(e) { console.error("Signaling error", e); }
            });
        }

        function sendSignal(type, data, targetId = null) {
            if (mqttClient && mqttClient.connected) {
                const payload = JSON.stringify({ 
                    clientId: myClientId, sender: myUsername, type: type, data: data, targetId: targetId 
                });
                mqttClient.publish(currentRoomTopic, payload);
            }
        }

        function initPeer(targetId, targetUsername, isInitiator) {
            if (peers[targetId]) return peers[targetId].peerConnection;

            const pc = new RTCPeerConnection(rtcConfig);
            peers[targetId] = { peerConnection: pc, username: targetUsername, dataChannel: null, stream: null };

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                if (!peers[targetId].stream) {
                    peers[targetId].stream = event.streams[0];
                    addVideoElement(targetId, targetUsername, event.streams[0], false);
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) sendSignal('ice', event.candidate, targetId);
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') updateRoomStatus();
                else if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) handlePeerDisconnect(targetId);
            };

            if (isInitiator) {
                const dc = pc.createDataChannel("chatChannel");
                peers[targetId].dataChannel = dc;
                setupDataChannelHandlers(dc, targetId, targetUsername);

                pc.createOffer().then(offer => pc.setLocalDescription(offer))
                                .then(() => sendSignal('offer', pc.localDescription, targetId));
            } else {
                pc.ondatachannel = (event) => {
                    const dc = event.channel;
                    peers[targetId].dataChannel = dc;
                    setupDataChannelHandlers(dc, targetId, targetUsername);
                };
            }

            return pc;
        }

        function setupDataChannelHandlers(dc, targetId, targetUsername) {
            dc.onopen = () => updateRoomStatus();
            dc.onclose = () => handlePeerDisconnect(targetId);
            dc.onmessage = (event) => {
                const data = JSON.parse(event.data);
                appendMessage(data.user, data.text, false);
            };
        }

        function handlePeerDisconnect(targetId) {
            if (peers[targetId]) {
                try { peers[targetId].peerConnection.close(); } catch(e){}
                delete peers[targetId];
            }
            removeVideoElement(targetId);
            updateRoomStatus();
        }

        function addVideoElement(id, labelText, stream, isLocal) {
            if (document.getElementById(`video-wrap-${id}`)) return;

            const wrapper = document.createElement('div');
            wrapper.id = `video-wrap-${id}`;
            wrapper.className = 'video-wrapper';

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isLocal) {
                video.muted = true; 
                if (currentFacingMode === 'user' && !isSharingScreen) {
                    video.classList.add('local-video');
                }
            }

            const label = document.createElement('div');
            label.className = 'video-label';
            label.textContent = labelText;

            wrapper.appendChild(video);
            wrapper.appendChild(label);
            videoGrid.appendChild(wrapper);
        }

        function removeVideoElement(id) {
            const wrapper = document.getElementById(`video-wrap-${id}`);
            if (wrapper) wrapper.remove();
        }

        function updateRoomStatus(forcedState, forcedText) {
            if (forcedState) {
                statusDiv.className = `status ${forcedState}`;
                statusDiv.textContent = forcedText;
                return;
            }

            let connectedCount = 0;
            for (let id in peers) {
                if (peers[id].dataChannel && peers[id].dataChannel.readyState === 'open') connectedCount++;
            }

            if (connectedCount > 0 || localStream || selectedMode === 'video') {
                statusDiv.className = "status connected";
                statusDiv.textContent = `Connected (${connectedCount + 1} users in room)`;
                msgInput.removeAttribute('disabled');
                msgInput.placeholder = `Message as ${myUsername}`;
                document.body.classList.add('connected-layout');
            } else {
                statusDiv.className = "status connecting";
                statusDiv.textContent = "Waiting for peers...";
                msgInput.setAttribute('disabled', 'true');
                document.body.classList.remove('connected-layout');
            }
        }

        btnCreate.addEventListener('click', async () => {
            finalizeUsername();
            if (selectedMode === 'video') {
                document.body.classList.add('video-active'); 
                await setupLocalMedia();
            }
            
            const generatedCode = Math.floor(100000 + Math.random() * 900000).toString(); 
            roomCodeOutput.textContent = generatedCode;
            roomCodeOutput.style.display = 'block';
            btnCreate.disabled = true;
            btnJoin.disabled = true;

            connectSignaling(generatedCode, () => {
                updateRoomStatus('connecting', 'Waiting for peers to join...');
                sendSignal('join', null);
            });
        });

        btnJoin.addEventListener('click', async () => {
            const code = roomCodeInput.value.trim();
            if (code.length !== 6 || isNaN(code)) return alert("Please enter a valid 6-digit room code.");

            finalizeUsername();
            if (selectedMode === 'video') {
                document.body.classList.add('video-active'); 
                await setupLocalMedia();
            }
            
            btnCreate.disabled = true;
            btnJoin.disabled = true;

            connectSignaling(code, () => {
                updateRoomStatus('connecting', 'Joining mesh...');
                sendSignal('join', null);
            });
        });

        btnToggleMic.addEventListener('click', () => {
            if (localStream) {
                const audioTrack = localStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    btnToggleMic.textContent = audioTrack.enabled ? "🎤 Mute Mic" : "🎙️ Unmute Mic";
                    btnToggleMic.classList.toggle('btn-danger', !audioTrack.enabled);
                }
            }
        });

        btnToggleCam.addEventListener('click', () => {
            if (localStream) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    btnToggleCam.textContent = videoTrack.enabled ? "📷 Cam Off" : "🎥 Cam On";
                    btnToggleCam.classList.toggle('btn-danger', !videoTrack.enabled);
                    
                    if (!isSharingScreen) {
                        btnSwitchCam.style.display = videoTrack.enabled ? 'flex' : 'none';
                    }
                    btnShareScreen.style.display = videoTrack.enabled ? 'flex' : 'none';
                }
            }
        });

        // פונקציית עזר להחלפת ה-Track אצל כל חברי ה-Mesh בבת אחת
        async function replaceLocalVideoTrack(newTrack) {
            const oldTrack = localStream.getVideoTracks()[0];
            if (oldTrack) {
                oldTrack.stop();
                localStream.removeTrack(oldTrack);
            }
            localStream.addTrack(newTrack);

            for (let id in peers) {
                const pc = peers[id].peerConnection;
                const senders = pc.getSenders();
                const videoSender = senders.find(sender => sender.track && sender.track.kind === 'video');
                if (videoSender) {
                    await videoSender.replaceTrack(newTrack);
                }
            }
        }

        btnSwitchCam.addEventListener('click', async () => {
            if (!localStream || isSharingScreen) return;

            currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';

            try {
                const newStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode }
                });
                const newVideoTrack = newStream.getVideoTracks()[0];

                await replaceLocalVideoTrack(newVideoTrack);

                const localVideoElem = document.querySelector('#video-wrap-local video');
                if (localVideoElem) {
                    localVideoElem.srcObject = localStream;
                    if (currentFacingMode === 'user') {
                        localVideoElem.classList.add('local-video');
                    } else {
                        localVideoElem.classList.remove('local-video');
                    }
                }
            } catch (err) {
                console.error("Failed to switch camera:", err);
                alert("Could not switch camera source.");
            }
        });

       
        btnShareScreen.addEventListener('click', async () => {
            if (!localStream) return;

            if (!isSharingScreen) {
                try {
                    
                    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const screenTrack = screenStream.getVideoTracks()[0];

                    
                    screenTrack.onended = () => {
                        stopScreenSharing();
                    };

                    await replaceLocalVideoTrack(screenTrack);

                    
                    const localVideoElem = document.querySelector('#video-wrap-local video');
                    if (localVideoElem) {
                        localVideoElem.srcObject = localStream;
                        localVideoElem.classList.remove('local-video');
                    }

                    isSharingScreen = true;
                    btnShareScreen.textContent = "🛑 Stop Share";
                    btnShareScreen.classList.add('btn-danger');
                    btnSwitchCam.style.display = 'none'; // אין טעם להחליף מצלמה בזמן שיתוף מסך

                } catch (err) {
                    console.error("Error standard screen sharing initialization:", err);
                }
            } else {
                await stopScreenSharing();
            }
        });

       
        async function stopScreenSharing() {
            if (!isSharingScreen) return;

            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
            }

            try {
                
                const camStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode }
                });
                const camTrack = camStream.getVideoTracks()[0];

                await replaceLocalVideoTrack(camTrack);

                const localVideoElem = document.querySelector('#video-wrap-local video');
                if (localVideoElem) {
                    localVideoElem.srcObject = localStream;
                    if (currentFacingMode === 'user') {
                        localVideoElem.classList.add('local-video');
                    }
                }

                isSharingScreen = false;
                btnShareScreen.textContent = "🖥️ Share Screen";
                btnShareScreen.classList.remove('btn-danger');
                btnSwitchCam.style.display = 'flex';

            } catch (err) {
                console.error("Failed to recover camera track:", err);
            }
        }

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && msgInput.value.trim() !== '') {
                const text = msgInput.value.trim();
                const payload = { user: myUsername, text: text };
                const stringPayload = JSON.stringify(payload);
                
                for (let id in peers) {
                    if (peers[id].dataChannel && peers[id].dataChannel.readyState === 'open') {
                        peers[id].dataChannel.send(stringPayload);
                    }
                }
                appendMessage(myUsername, text, true);
                msgInput.value = '';
            }
        });

        function appendMessage(username, text, isMe) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const userColor = isMe ? '#5865f2' : '#f23f43';
            
            const msgHtml = `
                <div class="message">
                    <div class="msg-header">
                        <span class="username" style="color: ${userColor};">${username}</span>
                        <span class="timestamp">Today at ${time}</span>
                    </div>
                    <div class="msg-text">${escapeHTML(text)}</div>
                </div>
            `;
            messagesDiv.insertAdjacentHTML('beforeend', msgHtml);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
